<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="经确认公开发布的 Codex 产出目录。">
  <title>公开产出目录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="返回公开产出目录首页">公开产出目录</a>
    <span class="access-note">公开访问</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="date-line">持续更新 · 仅发布已确认内容</p>
      <h1 id="page-title">把定稿留在这里。</h1>
      <p class="lede">已确认公开的网页、报告与看板。</p>
    </section>

    <section class="catalogue" aria-labelledby="catalogue-title">
      <div class="section-heading">
        <h2 id="catalogue-title">已发布内容</h2>
        <span class="count" aria-label="当前已发布内容数量">0 项</span>
      </div>
      <div class="empty-state">
        <p class="empty-title">尚无已确认发布的内容</p>
        <p>当你明确说“确认发布”后，对应产出才会出现在这里。</p>
      </div>
    </section>

    <section class="policy" aria-labelledby="policy-title">
      <h2 id="policy-title">发布规则</h2>
      <ol>
        <li><strong>默认留在本地。</strong> 新产出、草稿和中间版本不会自动公开。</li>
        <li><strong>逐项确认。</strong> 只有你明确指定并说“确认发布”的文件才会上线。</li>
        <li><strong>固定地址更新。</strong> 发布后，访问者刷新本页即可查看最新版。</li>
      </ol>
    </section>
  </main>

  <footer class="site-footer">
    <span>Codex Public Output</span>
    <span>最后更新：2026-11-24</span>
  </footer>
</body>
</html>
