<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>项目外包看板原型</title>
  <style>
/* PMIS reference · KOCA platform shell, workspace tabs and enterprise table */
/* Standalone prototype · native HTML controls */
:root {
  --ink: #1f2837;
  --muted: #525f71;
  --quiet: #667386;
  --blue: #007bff;
  --blue-dark: #005dbf;
  --blue-light: #eaf4ff;
  --blue-line: #b2d6ff;
  --blue-bar: #007bff;
  --blue-mid: #529bee;
  --canvas: #eff1f4;
  --paper: #fff;
  --line: #e4e8ee;
  --line-strong: #c8d1dd;
  --green: #167545;
  --green-mid: #28a36e;
  --green-soft: #eef9f3;
  --amber: #90570a;
  --amber-mid: #edaa38;
  --amber-soft: #fff7e6;
  --red: #b62f38;
  --red-mid: #e06269;
  --red-soft: #fff1f1;
  --soft: #f6f8fb;
  --table-head: #f2f5f9;
  --table-stripe: #fafbfd;
  --track: #e9edf3;
  --focus: #005dbf;
  --platform-blue: #3178c8;
  --platform-blue-deep: #2d70bd;
  --platform-white: #fff;
  --platform-band: #ffffff13;
  --platform-border: #ffffff63;
  --platform-chip: #15498458;
  --nav-overlay: #17283f59;
  --header-height: 60px;
  --rail-width: 204px;
  --radius: 4px;
  --shadow: 0 1px 2px #1a355403;
  --font-body: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-num: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-width: 0; min-height: 100%; overflow-x: clip; }
body { color: var(--ink); background: var(--canvas); font: 14px/1.5 var(--font-body); }
button, input, select { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--blue-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
:where(a, button, input, select, summary, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
:where(button, .worktabs a, .app-brand) { white-space: nowrap; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); overflow-wrap: anywhere; min-width: 0; }
.skip-link { position: fixed; z-index: 10; inset: 8px auto auto 12px; transform: translateY(-160%); background: var(--paper); padding: 8px 12px; border-radius: var(--radius); }
.skip-link:focus { transform: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app-header { position: sticky; top: 0; z-index: 8; color: var(--platform-white); background: linear-gradient(126deg, transparent 0 55%, var(--platform-band) 55% 75%, transparent 75%), linear-gradient(105deg, var(--platform-blue-deep), var(--platform-blue)); }
.app-header-inner { height: var(--header-height); padding: 0 24px; display: flex; align-items: center; gap: 12px; }
.app-header :focus-visible { outline-color: var(--platform-white); }
.app-brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 650; font-size: 17px; color: inherit; }
.app-brand:hover { text-decoration: none; }
.brand-icon { display: inline-flex; align-items: end; justify-content: center; gap: 3px; width: 30px; height: 30px; padding-bottom: 6px; flex: none; border: 1px solid var(--platform-border); border-radius: var(--radius); }
.brand-icon i { width: 3px; height: 8px; border-radius: 1px; background: currentColor; }
.brand-icon i:nth-child(2) { height: 12px; }
.brand-icon i:nth-child(3) { height: 16px; }
.demo-mark { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding: 2px 8px; color: inherit; background: var(--platform-chip); border: 1px solid var(--platform-border); border-radius: 3px; font-size: 12px; white-space: nowrap; }
.demo-mark span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.menu-toggle, .nav-scrim { display: none; }
.app-layout { display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); min-height: calc(100vh - var(--header-height)); }
.sidebar { min-width: 0; background: var(--paper); border-right: 1px solid var(--line); padding-top: 12px; }
.sidebar nav { position: sticky; top: calc(var(--header-height) + 12px); }
.sidebar-title { display: flex; align-items: center; gap: 12px; min-height: 36px; margin: 0 12px; padding-inline: 12px; font-size: 14px; font-weight: 600; }
.sidebar-link { position: relative; display: flex; align-items: center; gap: 8px; min-height: 40px; margin: 4px 8px 0; padding: 8px 12px 8px 26px; border-radius: 2px; color: var(--blue-dark); background: var(--blue-light); font-weight: 600; }
.sidebar-link::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px; border-radius: 0 2px 2px 0; background: var(--blue); }
.sidebar-link:hover { text-decoration: none; background: var(--blue-light); box-shadow: inset 0 0 0 1px var(--blue-line); }
.folder-icon, .dashboard-icon { position: relative; display: inline-block; flex: none; }
.folder-icon { width: 15px; height: 11px; border: 1.5px solid currentColor; border-radius: 2px; }
.folder-icon::before { content: ""; position: absolute; width: 7px; height: 3px; bottom: 100%; left: -1.5px; border: 1.5px solid currentColor; border-bottom: 0; border-radius: 2px 2px 0 0; }
.dashboard-icon { width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 2px; }
.dashboard-icon::before, .dashboard-icon::after { position: absolute; content: ""; background: currentColor; }
.dashboard-icon::before { top: 3px; left: 0; right: 0; height: 1px; }
.dashboard-icon::after { top: 3px; left: 4px; bottom: 0; width: 1px; }

.workspace { min-width: 0; }
.workspace-inner { max-width: 1568px; margin: 0 auto; min-width: 0; padding: 12px 16px 24px; }
.workbar { position: sticky; z-index: 3; top: var(--header-height); display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 34px; padding: 0 16px 0 8px; border-bottom: 1px solid var(--line); background: var(--paper); }
.worktabs { align-self: stretch; display: flex; flex: none; align-items: end; }
.worktab { display: flex; align-items: center; gap: 8px; padding: 4px 12px; height: 30px; background: var(--canvas); border: 1px solid var(--line); border-bottom-color: var(--canvas); border-radius: 3px 3px 0 0; color: var(--blue-dark); font-size: 12px; font-weight: 600; transform: translateY(1px); }
.worktab .dashboard-icon { scale: .85; }
.worktab:hover { background: var(--blue-light); text-decoration: none; }
.worktab:focus-visible { outline-offset: -2px; }
.work-scope { margin-left: auto; padding-right: 12px; border-right: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; }
.panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
#page-title:focus, #d-project-heading:focus { outline: none; }
.snapshot { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; white-space: nowrap; }
.snapshot time { font: 600 12px var(--font-num); color: var(--ink); font-variant-numeric: tabular-nums; }
.section-label { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 24px; }
.section-label::before { content: ""; width: 3px; height: 14px; background: var(--blue); border-radius: 1px; flex: none; }

.portfolio-summary { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 12px; margin-bottom: 12px; }
.summary-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.summary-heading > span { color: var(--muted); font-size: 12px; }
.health-layout { display: grid; grid-template-columns: minmax(112px, 1fr) minmax(0, 1.12fr); align-items: center; gap: 16px; padding: 12px 16px; }
.health-ring { position: relative; display: grid; place-items: center; justify-self: center; width: 104px; height: 104px; border-radius: 50%; background: conic-gradient(var(--green-mid) 0 var(--slice-one), var(--amber-mid) var(--slice-one) var(--slice-two), var(--red-mid) var(--slice-two) 100%); }
.health-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--paper); }
.ring-label { position: relative; display: grid; justify-items: center; line-height: 1.15; gap: 4px; }
.ring-label strong { font: 650 32px/1 var(--font-num); color: var(--ink); }
.ring-label span { color: var(--muted); font-size: 12px; }
.summary-controls { display: grid; gap: 4px; min-width: 0; }
.health-selector, .stage-selector { display: grid; align-items: center; background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 8px; text-align: left; min-width: 0; }
.health-selector { grid-template-columns: 1fr auto; gap: 8px; }
.health-selector:hover, .stage-selector:hover { background: var(--soft); }
.health-selector[aria-pressed="true"], .stage-selector[aria-pressed="true"] { background: var(--blue-light); border-color: var(--blue-line); }
.health-label { display: inline-flex; justify-self: start; align-items: center; gap: 4px; padding: 0 6px; color: var(--status-fg); background: var(--status-bg); border-radius: var(--radius); font-size: 12px; }
.health-selector .value, .stage-selector .value { font: 600 14px var(--font-num); font-variant-numeric: tabular-nums; }
.health-selector .value small { margin-left: 4px; color: var(--muted); font: 12px var(--font-body); }
.health-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status-icon, currentColor); flex: none; }
.tone-ok { --status-fg: var(--green); --status-bg: var(--green-soft); --status-icon: var(--green-mid); }
.tone-watch { --status-fg: var(--amber); --status-bg: var(--amber-soft); --status-icon: var(--amber-mid); }
.tone-risk { --status-fg: var(--red); --status-bg: var(--red-soft); --status-icon: var(--red-mid); }
.health { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius); background: var(--status-bg); color: var(--status-fg); font-size: 12px; white-space: nowrap; }
.stage-controls { display: grid; padding: 8px 16px; }
.stage-selector { grid-template-columns: 64px minmax(0, 1fr) 24px; gap: 8px; padding: 0 8px; min-height: 24px; }
.stage-selector > span:first-child { font-size: 13px; }
.stage-selector .value { text-align: right; }
.stage-track, .cell-track { display: block; background: var(--track); overflow: hidden; border-radius: 4px; }
.stage-track { height: 6px; }
.stage-track i, .cell-track i { display: block; height: 100%; width: var(--bar-width); background: var(--blue-bar); border-radius: inherit; }

.list-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 8px 16px; }
.list-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.list-count { color: var(--muted); background: var(--soft); padding: 0 8px; border-radius: var(--radius); font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 12px; }
.filter-field { display: flex; align-items: center; gap: 8px; min-width: 0; }
.filter-field > span:first-child { white-space: nowrap; }
.search-control { display: block; position: relative; min-width: 0; width: 224px; }
.search-icon { width: 12px; height: 12px; position: absolute; top: 9px; left: 10px; border: 1.5px solid var(--quiet); border-radius: 50%; pointer-events: none; }
.search-icon::after { content: ""; position: absolute; width: 5px; height: 1.5px; background: var(--quiet); top: 8px; left: 8px; rotate: 45deg; transform-origin: left center; }
.filters :where(input, select, button) { border: 1px solid var(--line-strong); background: var(--paper); border-radius: var(--radius); min-height: 32px; color: var(--ink); font-size: 14px; }
.filters input { width: 100%; padding: 4px 8px 4px 28px; }
.filters input::placeholder { color: var(--quiet); opacity: 1; }
.filters select { padding: 4px 8px; min-width: 108px; }
.filters :where(input, select):hover { border-color: var(--quiet); }
.filters .reset { padding: 4px 12px; min-width: 64px; }
.filters .reset:hover:not(:disabled) { background: var(--blue-light); color: var(--blue-dark); border-color: var(--blue); }
.filters .reset:disabled { color: var(--quiet); background: var(--soft); border-color: var(--line); }
.mobile-scroll-hint { display: none; }

.project-grid { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-color: var(--line-strong) var(--soft); }
.project-grid:focus-visible { outline-offset: -2px; }
.project-table { width: 100%; min-width: 1104px; border-spacing: 0; border-collapse: separate; table-layout: fixed; text-align: left; }
.project-table th { background: var(--table-head); color: var(--ink); border-block: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.project-table :where(th, td) { padding: 8px; vertical-align: middle; }
.project-table :where(th, td):first-child { padding-left: 16px; }
.project-table :where(th, td):last-child { padding-right: 16px; }
.project-table th:nth-child(1) { width: 16%; }
.project-table th:nth-child(2) { width: 15.2%; }
.project-table th:nth-child(3) { width: 6.3%; }
.project-table th:nth-child(4) { width: 7.2%; }
.project-table th:nth-child(5) { width: 6.6%; }
.project-table th:nth-child(6) { width: 8.6%; }
.project-table th:nth-child(7) { width: 11.5%; }
.project-table th:nth-child(8) { width: 14%; }
.project-table th:nth-child(9) { width: 14.6%; }
.project-table :is(th, td):is(:nth-child(6), :nth-child(7), :nth-child(9)) { text-align: right; }
.project-table td { height: 48px; font-size: 14px; border-bottom: 1px solid var(--line); line-height: 1.36; }
.project-table tbody tr:not(.empty-row) { cursor: pointer; }
.project-table tbody tr:nth-child(even) td { background: var(--table-stripe); }
.project-table tbody tr:not(.empty-row):hover td, .project-table tbody tr:not(.empty-row):focus-within td { background: var(--blue-light); }
.project-table .sort { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font-weight: inherit; }
.sort .sort-icon { font: 12px/1 var(--font-num); color: var(--quiet); }
.project-table th[aria-sort] .sort-icon, .project-table .sort:hover { color: var(--blue-dark); }
.project-link, .customer-cell > span, .milestone-cell > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-link { color: var(--blue-dark); font-weight: 550; }
.barcell { display: grid; gap: 4px; margin-left: auto; max-width: 100px; }
.cell-value { font: 600 14px/1.15 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell-track { height: 4px; }
.barcell.cost .cell-track i { background: var(--blue-mid); }
.barcell.over { color: var(--red); }
.barcell.over .cell-track i { background: var(--red-mid); }
.milestone-cell { display: grid; gap: 2px; min-width: 0; }
.milestone-cell small { color: var(--muted); font: 12px var(--font-body); white-space: nowrap; }
.milestone-cell small.late { color: var(--red); }
.weekly-cell { white-space: nowrap; font-variant-numeric: tabular-nums; }
.weekly-number { font: 600 14px var(--font-num); }
.weekly-number.neutral, .missing { color: var(--muted); }
.project-table .empty-row td { text-align: center; padding: 24px 16px; color: var(--muted); }
.empty-row strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.table-notes { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 8px 16px; color: var(--muted); font-size: 12px; }
.unknown-project { padding: 20px; }
.unknown-project a { display: inline-block; margin-top: 8px; }
.no-script { padding: 16px; }

@media (max-width: 1360px) {
  .project-table :where(th, td):first-child { position: sticky; left: 0; z-index: 1; background: var(--paper); box-shadow: 1px 0 var(--line); }
  .project-table th:first-child { background: var(--table-head); }
  .project-table .empty-row td { position: static; box-shadow: none; text-align: left; }
  .mobile-scroll-hint { display: block; color: var(--muted); font-size: 12px; }
}
@media (max-width: 1024px) {
  .app-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .app-header-inner { padding-inline: 12px; }
  .menu-toggle { display: grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0; color: inherit; background: transparent; border: 1px solid transparent; border-radius: var(--radius); }
  .menu-toggle:hover, .menu-toggle[aria-expanded="true"] { background: var(--platform-chip); border-color: var(--platform-border); }
  .menu-toggle span { width: 15px; height: 2px; border-radius: 1px; background: currentColor; box-shadow: 0 -5px currentColor, 0 5px currentColor; }
  .mobile-nav-open .sidebar { display: block; position: fixed; z-index: 7; top: var(--header-height); bottom: 0; left: 0; width: min(232px, 82vw); }
  .mobile-nav-open .nav-scrim:not([hidden]) { display: block; position: fixed; z-index: 6; inset: var(--header-height) 0 0; border: 0; padding: 0; background: var(--nav-overlay); }
}
@media (max-width: 640px) {
  .workspace-inner { padding: 12px 12px 24px; }
  .work-scope { display: none; }
  .snapshot { margin-left: auto; }
  .portfolio-summary { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; align-items: end; gap: 8px; padding: 12px; }
  .filter-field { display: grid; gap: 4px; }
  .filter-field > span:first-child { font-size: 12px; color: var(--muted); }
  .search-field { grid-column: 1 / -1; }
  .search-control { width: 100%; }
  .filters select { min-width: 0; width: 100%; padding-inline: 4px; }
  .filters .reset { min-width: 0; padding-inline: 8px; }
  .project-table th:first-child { width: 160px; }
}
@media (max-width: 440px) {
  .app-header-inner { gap: 8px; }
  .app-brand { gap: 8px; font-size: 15px; }
  .brand-icon { width: 26px; height: 26px; padding-bottom: 4px; }
  .workbar { padding-right: 8px; }
  .list-header, .table-notes { padding-inline: 12px; }
}

.d-view {
  --d-name-col: 216px;
  --d-names-background: var(--paper);
  --d-pad: 16px;
  display: grid;
  gap: 12px;
  min-width: 0;
}

.d-view .panel { min-width: 0; }

.d-project-header { padding: 0 var(--d-pad); }
.d-project-heading-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 52px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.d-project-title { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.d-project-title h1 { margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.d-back-link { display: inline-flex; align-items: center; gap: 4px; flex: none; color: var(--blue-dark); font-size: 13px; font-weight: 500; white-space: nowrap; }
.d-back-link:hover { text-decoration: underline; }
.d-back-link span { font-size: 16px; line-height: 1; }
.d-project-meta { display: flex; flex-wrap: wrap; gap: 4px 24px; margin: 0; padding-block: 12px 0; font-size: 13px; }
.d-project-meta > div { display: flex; flex-wrap: wrap; gap: 2px 8px; }
.d-project-meta dt { color: var(--muted); font-size: 12px; align-self: center; }
.d-project-meta dd { color: var(--ink); margin: 0; font-weight: 500; }

.d-kpis {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin: 12px var(--d-pad);
}

.d-kpi {
  min-height: 68px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  min-width: 0;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.d-kpi-ring { flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; }
.d-kpi-label { color: var(--muted); font-size: 12px; line-height: 1.5; }
.d-kpi-value { color: var(--ink); font: 650 clamp(18px, 1.55vw, 23px) / 1.12 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.03em; white-space: nowrap; }
.d-kpi-value small { margin-inline-start: 2px; font: 500 12px / 1.2 var(--font-body, sans-serif); letter-spacing: 0; color: var(--muted); }
.d-kpi-ring .d-kpi-label { margin-bottom: 4px; }
.d-ring {
  --d-ring-color: var(--blue);
  position: relative;
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: conic-gradient(var(--d-ring-color) var(--d-ring-value), var(--track) var(--d-ring-value));
}

.d-ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--soft); }
.d-ring-over .d-ring { --d-ring-color: var(--red); }

.d-deliverables { border-top: 1px solid var(--line); }
.d-deliverables summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 8px;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  padding: 8px var(--d-pad);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}

.d-deliverables summary::-webkit-details-marker { display: none; }
.d-deliverables summary:hover { color: var(--blue-dark); background: var(--soft); }
.d-delivery-chevron {
  width: 7px;
  height: 7px;
  border-top: 1.5px solid var(--muted);
  border-right: 1.5px solid var(--muted);
  transform: rotate(45deg);
}

.d-deliverables[open] .d-delivery-chevron { transform: rotate(135deg); }

const detailStatuses = ['全部', '已完成', '进行中', '已逾期', '未开始'];
const detailStatusClasses = { 已完成: 'done', 进行中: 'active', 已逾期: 'late', 未开始: 'waiting' };
const detailDateDay = 86400000;
const detailNumber = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 1 });

function detailDay(value) {
  return Date.parse(`${value}T00:00:00Z`);
}

function detailMonthStart(day, offset = 0) {
  const date = new Date(day);
  return Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + offset, 1);
}

function detailShortDate(value) {
  return value ? value.slice(5) : '—';
}

function detailPercent(value) {
  return value == null ? '—' : `${detailNumber.format(value)}%`;
}

function detailProgress(milestone) {
  return statusOf(milestone) === '已完成' ? 100 : (milestone.progress ?? 0);
}

function detailStatusPill(milestone) {
  const status = statusOf(milestone);
  return `<span class="d-status d-${detailStatusClasses[status]}"><i aria-hidden="true"></i>${status}</span>`;
}

function detailRing(label, value, type) {
  const fill = Math.min(100, Math.max(0, value ?? 0));
  const color = type === 'cost' && value > 100 ? ' d-ring-over' : '';
  return `<div class="d-kpi d-kpi-ring${color}">
    <div class="d-ring" style="--d-ring-value:${fill}%" aria-hidden="true"></div>
    <div><div class="d-kpi-label">${label}</div><div class="d-kpi-value">${detailPercent(value)}</div></div>
  </div>`;
}

function detailKpi(label, value, suffix = '') {
  return `<div class="d-kpi"><div class="d-kpi-label">${label}</div><div class="d-kpi-value">${value}${suffix ? `<small>${suffix}</small>` : ''}</div></div>`;
}

function detailDeliveryTable(deliverables) {
  if (!deliverables.length) return '<p class="d-empty">暂无交付物</p>';
  const classes = { 已验收: 'done', 待验收: 'active', 未提交: 'waiting' };
  return `<div class="d-delivery-scroll"><table class="d-delivery-table">
    <thead><tr><th scope="col">交付物名称</th><th scope="col">验收状态</th><th scope="col">验收日期</th></tr></thead>
    <tbody>${deliverables.map(item => `<tr><td>${escapeHtml(item.name)}</td><td><span class="d-status d-${classes[item.status]}"><i aria-hidden="true"></i>${escapeHtml(item.status)}</span></td><td>${formatDate(item.acceptedDate)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function detailDateFrame(milestones, windowName = 'all') {
  const now = detailDay(todayISO);
  if (windowName === 'near') return { start: detailMonthStart(now, -1), end: detailMonthStart(now, 2), now };
  const dates = milestones.flatMap(item => [detailDay(item.start), detailDay(item.end)]);
  return {
    start: detailMonthStart(Math.min(now, ...dates)),
    end: detailMonthStart(Math.max(now, ...dates), 1),
    now,
  };
}

function detailPosition(day, frame) {
  return (day - frame.start) / (frame.end - frame.start) * 100;
}

function detailFrameMonths(frame) {
  const months = [];
  for (let day = frame.start; day < frame.end; day = detailMonthStart(day, 1)) {
    const month = new Date(day);
    months.push({ day, label: `${month.getUTCMonth() + 1}月`, year: month.getUTCFullYear(), january: month.getUTCMonth() === 0 });
  }
  return months;
}

function detailPlotRulers(frame, months, labels = false) {
  return months.map((month, index) => {
    const position = detailPosition(month.day, frame);
    const label = index === 0 || month.january ? `${month.year}年${month.label}` : month.label;
    return `<span class="d-grid-line" style="--d-pos:${position}%">${labels === true ? `<span>${label}</span>` : ''}</span>`;
  }).join('') + `<span class="d-today-line" style="--d-pos:${detailPosition(frame.now, frame)}%">${labels ? `<b>基准日 ${detailShortDate(todayISO)}</b>` : ''}</span>`;
}

function detailDelay(milestone, now) {
  const start = detailDay(milestone.start);
  const end = detailDay(milestone.end);
  if (statusOf(milestone) === '已完成' || now < start) return 0;
  const span = Math.max(1, (end - start) / detailDateDay + 1);
  const expected = Math.min(100, (Math.floor((now - start) / detailDateDay) + 1) / span * 100);
  return Math.max(0, Math.round(expected - detailProgress(milestone)));
}

function detailVisibleRows(milestones, filter, frame) {
  return milestones.filter(item => (filter === '全部' || statusOf(item) === filter)
    && detailDay(item.start) < frame.end && detailDay(item.end) >= frame.start);
}

function detailGantt(milestones, selected, filter, windowName) {
  const frame = detailDateFrame(milestones, windowName);
  const months = detailFrameMonths(frame);
  const rows = detailVisibleRows(milestones, filter, frame);
  if (rows.length === 0) return '<p class="d-empty d-chart-empty">当前视图暂无里程碑</p>';

  const header = detailPlotRulers(frame, months, true);
  const guides = detailPlotRulers(frame, months);
  const content = rows.map(item => {
    const start = detailDay(item.start);
    const end = detailDay(item.end) + detailDateDay;
    const progress = detailProgress(item);
    const visibleStart = Math.max(start, frame.start);
    const visibleEnd = Math.min(end, frame.end);
    const completedEnd = Math.min(visibleEnd, start + (end - start) * progress / 100);
    const visibleProgress = Math.max(0, (completedEnd - visibleStart) / (visibleEnd - visibleStart) * 100);
    const position = detailPosition(visibleStart, frame);
    const width = detailPosition(visibleEnd, frame) - position;
    const labelPlacement = position + width <= 86 ? '' : position > 22 ? ' d-label-left' : ' d-label-inside';
    const modifier = statusOf(item) === '未开始' ? ' d-track-empty' : '';
    const delay = detailDelay(item, frame.now);
    const safeName = escapeHtml(item.name);
    const safeId = escapeHtml(item.id);
    return `<div class="d-gantt-row" data-d-row="${safeId}">
      <div class="d-gantt-name d-${detailStatusClasses[statusOf(item)]}">
        <button type="button" class="d-gantt-select" data-d-select="${safeId}" aria-pressed="${item.id === selected}" aria-label="${safeName}，${statusOf(item)}，实际进度 ${progress}%，计划 ${formatDate(item.start)} 至 ${formatDate(item.end)}" title="${safeName}">
          <i aria-hidden="true"></i><span><b>${safeName}</b><small>${detailShortDate(item.start)} 至 ${detailShortDate(item.end)}</small></span>
        </button>
      </div>
      <div class="d-gantt-plot" aria-hidden="true">${guides}
        <div class="d-bar d-${detailStatusClasses[statusOf(item)]}${modifier}${labelPlacement}" data-d-plot-select="${safeId}" style="--d-pos:${position}%;--d-size:${width}%;--d-fill:${visibleProgress}%">
          <span class="d-bar-fill"></span><span class="d-bar-label">${progress}%${delay ? `<em>落后 ${delay} 个百分点</em>` : ''}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="d-gantt-scroll" tabindex="0" role="region" aria-label="里程碑甘特图，可横向滚动">
    <div class="d-gantt-sheet" style="--d-plot-width:${Math.max(620, months.length * 84)}px">
      <div class="d-gantt-row d-gantt-heading"><div class="d-gantt-name">里程碑 / 计划工期</div><div class="d-gantt-plot" aria-hidden="true">${header}</div></div>
      ${content}
    </div>
  </div>`;
}

function detailTimeline(milestones, selected) {
  if (milestones.length === 0) return '<p class="d-empty d-chart-empty">暂无里程碑</p>';
  const frame = detailDateFrame(milestones);
  const months = detailFrameMonths(frame);
  const timelineWidth = Math.max(760, months.length * 104);
  const chronological = [...milestones].sort((a, b) => a.end.localeCompare(b.end));
  const labelLanes = [];
  const nodes = [];
  for (const item of chronological) {
    const x = Math.min(97, Math.max(3, detailPosition(detailDay(item.end), frame)));
    const label = escapeHtml(item.name);
    const compact = item.name.length > 12 ? `${item.name.slice(0, 11)}…` : item.name;
    const labelX = Math.min(94, Math.max(6, x));
    const id = escapeHtml(item.id);
    const laneGap = Math.min(18, (Math.min(12, compact.length) * 12 + 26) / timelineWidth * 100);
    let lane = labelLanes.findIndex((end) => labelX > end + laneGap);
    if (lane < 0) lane = labelLanes.length;
    labelLanes[lane] = labelX;
    const alignment = x < 8 ? ' d-label-align-start' : x > 92 ? ' d-label-align-end' : '';
    nodes.push(`<button type="button" class="d-timeline-node d-${detailStatusClasses[statusOf(item)]}${alignment}" data-d-select="${id}" aria-label="${label}，计划完成 ${item.end}，${statusOf(item)}" aria-pressed="${item.id === selected}" style="--d-x:${x}%;--d-lane:${lane};--d-date-lane:${lane % 2}" title="${label} · ${item.end}">
      <span class="d-timeline-label">${escapeHtml(compact)}</span><span class="d-node-circle"></span><span class="d-node-date">${detailShortDate(item.end)}</span>
    </button>`);
  }
  const firstOpen = chronological.findIndex(item => statusOf(item) !== '已完成');
  const lastDone = chronological[(firstOpen < 0 ? chronological.length : firstOpen) - 1];
  const filled = lastDone ? Math.min(97, Math.max(3, detailPosition(detailDay(lastDone.end), frame))) : 0;
  return `<div class="d-timeline-scroll" tabindex="0" role="region" aria-label="里程碑时间轴，可横向滚动">
    <div class="d-timeline-plot" style="--d-timeline-width:${timelineWidth}px;--d-lane-count:${labelLanes.length};--d-timeline-fill:${filled}%">
      ${detailPlotRulers(frame, months, 'timeline')}
      <div class="d-timeline-axis"></div>${nodes.join('')}
    </div>
  </div>`;
}

function detailSelection(milestone, includeDelay = false) {
  if (!milestone) return '';
  const delay = includeDelay ? detailDelay(milestone, detailDay(todayISO)) : 0;
  return `<div class="d-selection">
    <span class="d-selection-name">${escapeHtml(milestone.name)}</span>
    ${detailStatusPill(milestone)}
    <span>计划完成 <b>${formatDate(milestone.end)}</b></span>
    <span>实际完成 <b>${formatDate(milestone.actualDate)}</b></span>
    <span>实际进度 <b>${detailProgress(milestone)}%</b></span>
    ${delay ? `<span class="d-delay">较计划时间进度落后 ${delay} 个百分点</span>` : ''}
  </div>`;
}

function detailInitialSelection(milestones) {
  return milestones.find(item => statusOf(item) === '已逾期')
    ?? milestones.find(item => statusOf(item) === '进行中') ?? milestones[0];
}

  const milestones = project.milestones ?? [];
  const deliverables = project.deliverables ?? [];
  const selected = detailInitialSelection(milestones);
  const completed = milestones.filter(item => statusOf(item) === '已完成').length;
  const accepted = deliverables.filter(item => item.status === '已验收').length;
  const statusCounts = Object.fromEntries(detailStatuses.map(status => [status, status === '全部' ? milestones.length : milestones.filter(item => statusOf(item) === status).length]));
  return `<div class="d-view">
    <section class="panel d-summary" aria-labelledby="d-project-heading">
      <div class="d-project-header">
        <div class="d-project-heading-row">
          <div class="d-project-title"><h1 id="d-project-heading" tabindex="-1">${escapeHtml(project.name)}</h1>${healthBadge(project.health)}</div>
          <a class="d-back-link" href="#projects" data-return><span aria-hidden="true">←</span>返回看板</a>
        </div>
        <dl class="d-project-meta"><div><dt>客户名称</dt><dd>${escapeHtml(project.customer)}</dd></div><div><dt>项目阶段</dt><dd>${escapeHtml(project.stage)}</dd></div><div><dt>项目经理</dt><dd>${escapeHtml(project.manager)}</dd></div></dl>
      </div>
      <div class="d-kpis">
        ${detailRing('项目进度', project.progress, 'progress')}

        ${detailKpi('实际消耗', project.actual == null ? '—' : detailNumber.format(project.actual), '人天')}
        ${detailKpi('已完成里程碑', `${completed}<small> / ${milestones.length}</small>`)}
        ${detailKpi('已验收交付物', `${accepted}<small> / ${deliverables.length}</small>`)}
      </div>
      <details class="d-deliverables">
        <summary><span>验收交付物明细</span><span class="d-delivery-count">已验收 ${accepted} 项 / 应验收 ${deliverables.length} 项</span><i class="d-delivery-chevron" aria-hidden="true"></i></summary>

        </div>
      </div>
      <div class="d-chart-body">
        <div class="d-filters" role="group" aria-label="筛选里程碑状态">
          ${detailStatuses.map(status => `<button type="button" class="${status === '全部' ? '' : `d-${detailStatusClasses[status]}`}" data-d-filter="${status}" aria-pressed="${status === '全部'}">${status === '全部' ? '' : '<i aria-hidden="true"></i>'}${status}<span>${statusCounts[status]}</span></button>`).join('')}
        </div>
        ${milestones.length ? '<p class="d-scroll-hint">横向滑动查看完整甘特图</p>' : ''}
        <div class="d-gantt-root">${detailGantt(milestones, selected?.id, '全部', 'all')}</div>
        ${milestones.length ? '<p class="d-chart-note">条形区间为计划工期，实心部分表示实际进度。落后幅度按计划工期的日历天数估算。</p>' : ''}

function bindDetail(container, project) {
  const view = container.matches('.d-view') ? container : container.querySelector('.d-view');
  if (!view) return;
  const milestones = project.milestones ?? [];
  let selected = detailInitialSelection(milestones);
  let filter = '全部';
  let windowName = 'all';

  function visibleRows() {
    return detailVisibleRows(milestones, filter, detailDateFrame(milestones, windowName));
  }

  function updateSelection(selectedInGantt = selected) {
    view.querySelectorAll('[data-d-select]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.dSelect === selected?.id));
    });
    view.querySelector('[data-d-selection="gantt"]').innerHTML = detailSelection(selectedInGantt, true);
    view.querySelector('[data-d-selection="timeline"]').innerHTML = detailSelection(selected);
  }

  function renderGantt() {
    const visible = visibleRows();
    if (visible.length && !visible.includes(selected)) selected = detailInitialSelection(visible);
    view.querySelectorAll('[data-d-filter]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.dFilter === filter)));
    view.querySelectorAll('[data-d-window]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.dWindow === windowName)));
    view.querySelector('.d-gantt-root').innerHTML = detailGantt(milestones, selected?.id, filter, windowName);
    updateSelection(visible.includes(selected) ? selected : null);
  }

  function selectMilestone(id) {
    selected = milestones.find(item => item.id === id);
    if (!selected) return;
    if (visibleRows().includes(selected)) {
      updateSelection();
      return;
    }
    if (filter !== '全部' && statusOf(selected) !== filter) filter = '全部';
    if (!visibleRows().includes(selected)) windowName = 'all';
    renderGantt();
  }

  view.addEventListener('click', event => {
    const plotBar = event.target.closest('[data-d-plot-select]');
    if (plotBar) {
      selectMilestone(plotBar.dataset.dPlotSelect);
      return;
    }
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.dSelect) selectMilestone(button.dataset.dSelect);
    if (button.dataset.dFilter) {
      filter = button.dataset.dFilter;
      renderGantt();
    }
    if (button.dataset.dWindow) {
      windowName = button.dataset.dWindow;
      renderGantt();
    }
  });
}

const todayISO = '2026-11-23';
const healthTone = { '健康': 'tone-ok', '预警': 'tone-watch', '异常': 'tone-risk' };
const healthLevels = Object.keys(healthTone);
const stages = ['项目启动', '需求分析', '开发实施', '联调测试', '验收交付'];
const filters = { query: '', health: '', stage: '', sortKey: '', sortDirection: '' };
const projectView = document.querySelector('#view');
const workspaceTab = document.querySelector('.worktab');
const menuToggle = document.querySelector('#menu-toggle');
const sidebar = document.querySelector('#project-sidebar');
const navScrim = document.querySelector('.nav-scrim');
const isNarrowLayout = window.matchMedia('(max-width: 1024px)');
const zhCollator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
const numericFormat = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 1 });
const dateMillis = (iso) => Date.parse(iso + 'T00:00:00Z');
let lastRoute = null;
let lastListLocation = null;

function escapeHtml(value) {
  const replacements = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value ?? '').replace(/[&<>"']/g, (character) => replacements[character]);
}

function formatDate(value) {
  return value || '—';
}

function statusOf(milestone) {
  if (milestone.actualDate || milestone.progress >= 100) return '已完成';
  if (milestone.end && milestone.end < todayISO) return '已逾期';
  return milestone.progress > 0 ? '进行中' : '未开始';
}

function healthBadge(health) {
  return `<span class="health ${healthTone[health] || ''}"><i class="health-dot" aria-hidden="true"></i>${escapeHtml(health)}</span>`;
}

function nearestMilestone(project) {
  const scheduled = project.milestones.filter((milestone) => milestone.end);
  const pending = scheduled.filter((milestone) => statusOf(milestone) !== '已完成');
  if (!pending.length) return scheduled.reduce((last, candidate) => !last || candidate.end > last.end ? candidate : last, null);
  const distance = (milestone) => Math.abs(dateMillis(milestone.end) - dateMillis(todayISO));
  return [...pending].sort((a, b) => distance(a) - distance(b) || a.end.localeCompare(b.end))[0];
}

function homeSummary() {
  const counts = healthLevels.map((name) => projects.filter((project) => project.health === name).length);
  const percentage = (count) => projects.length ? count * 100 / projects.length : 0;
  return `<section class="portfolio-summary" aria-label="项目概览">
    <div class="panel summary-section">
      <div class="summary-heading"><h2 class="section-label">项目健康度</h2></div>
      <div class="health-layout">
        <div class="health-ring" style="--slice-one:${percentage(counts[0])}%;--slice-two:${percentage(counts[0] + counts[1])}%">
          <div class="ring-label"><strong>${projects.length}</strong><span>未关闭项目</span></div>
        </div>
        <div class="summary-controls" aria-label="按健康度筛选">
          ${healthLevels.map((name, index) => `<button type="button" class="health-selector" data-filter-health="${name}" aria-pressed="false">
            <span class="health-label ${healthTone[name]}"><i class="health-dot" aria-hidden="true"></i>${name}</span><span class="value">${counts[index]}<small>个</small></span>
          </button>`).join('')}
        </div>
      </div>
    </div>
    <div class="panel summary-section">
      <div class="summary-heading"><h2 class="section-label">项目阶段分布</h2><span>项目数</span></div>
      <div class="stage-controls" aria-label="按项目阶段筛选">
        ${stages.map((name) => {
          const count = projects.filter((project) => project.stage === name).length;
          return `<button type="button" class="stage-selector" data-filter-stage="${name}" aria-pressed="false">
            <span>${name}</span><span class="stage-track" aria-hidden="true"><i style="--bar-width:${percentage(count)}%"></i></span><span class="value">${count}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  </section>`;
}

function sortableHeader(caption, key, title = '') {
  return `<th scope="col" data-column="${key}"><button type="button" class="sort" data-sort="${key}"${title ? ` title="${escapeHtml(title)}"` : ''}>${caption}<span class="sort-icon" aria-hidden="true">↕</span></button></th>`;
}

function renderHome() {
  return `<h1 id="page-title" class="visually-hidden" tabindex="-1">项目外包看板</h1>
  ${homeSummary()}
  <section class="panel filters" aria-label="筛选项目">
      <label class="filter-field search-field"><span>关键词</span><span class="search-control"><i class="search-icon" aria-hidden="true"></i><input id="project-search" type="search" placeholder="项目、客户或项目经理" aria-label="搜索项目、客户或项目经理" autocomplete="off"></span></label>
      <label class="filter-field"><span>健康度</span><select id="health-filter" aria-label="按健康度筛选">
        <option value="">全部</option>${healthLevels.map((option) => `<option>${option}</option>`).join('')}
      </select></label>
      <label class="filter-field"><span>项目阶段</span><select id="stage-filter" aria-label="按项目阶段筛选">
        <option value="">全部</option>${stages.map((option) => `<option>${option}</option>`).join('')}
      </select></label>
      <button id="reset-filters" class="reset" type="button">重置</button>
  </section>
  <section class="panel project-list" aria-labelledby="list-title">
    <div class="list-header">
      <div class="list-title"><h2 class="section-label" id="list-title">项目清单</h2></div>
      <span id="table-scroll-hint" class="mobile-scroll-hint">横向滑动查看全部字段</span>
    </div>
    <div class="project-grid" role="region" aria-label="项目清单表格" tabindex="0">
      <table class="project-table" aria-labelledby="list-title">
        <thead><tr>
          ${sortableHeader('项目名称', 'name')}
          <th scope="col">客户名称</th>
          <th scope="col">健康度</th>
          <th scope="col">项目阶段</th>
          <th scope="col">项目经理</th>
          ${sortableHeader('项目进度', 'progress')}
          ${sortableHeader('成本消耗进度', 'cost')}
          ${sortableHeader('最近里程碑节点', 'milestone', '优先显示计划完成日离统计日期最近的未完成节点')}
          ${sortableHeader('上周成本消耗增量', 'weekly', '演示单位：百分点')}
        </tr></thead>
        <tbody id="project-rows"></tbody>
      </table>
    </div>
    <div class="table-notes"><span>上周成本消耗增量 · 单位为百分点</span><span id="project-count" class="list-count" aria-live="polite"></span></div>
  </section>`;
}

function progressCell(value, isCost = false) {
  if (!Number.isFinite(value)) return '<span class="missing" aria-label="暂无数据">-</span>';
  const type = isCost ? (value > 100 ? 'cost over' : 'cost') : '';
  const width = Math.min(100, Math.max(0, value));
  return `<div class="barcell ${type}"><span class="cell-value">${numericFormat.format(value)}%</span>
    <span class="cell-track" aria-hidden="true"><i style="--bar-width:${width}%"></i></span></div>`;
}

function projectRow(project) {
  const milestone = nearestMilestone(project);
  const overdue = milestone && statusOf(milestone) === '已逾期';
  const milestoneLabel = milestone
    ? `<div class="milestone-cell"><span title="${escapeHtml(milestone.name)}">${escapeHtml(milestone.name)}</span><small class="${overdue ? 'late' : ''}">${formatDate(milestone.end)}${overdue ? ' · 逾期' : (statusOf(milestone) === '已完成' ? ' · 已完成' : '')}</small></div>`
    : '<span class="missing" aria-label="暂无里程碑">-</span>';
  const amount = Number.isFinite(project.weekly)
    ? `<span class="weekly-number ${project.weekly === 0 ? 'neutral' : ''}">${project.weekly > 0 ? '+' : ''}${numericFormat.format(project.weekly)}</span>`
    : '<span class="missing" aria-label="暂无数据">-</span>';
  return `<tr data-project-row="${escapeHtml(project.id)}">
    <td><a class="project-link" href="#project/${encodeURIComponent(project.id)}" data-project="${escapeHtml(project.id)}" title="${escapeHtml(project.name)}">${escapeHtml(project.name)}</a></td>
    <td class="customer-cell"><span title="${escapeHtml(project.customer)}">${escapeHtml(project.customer)}</span></td>
    <td>${healthBadge(project.health)}</td>
    <td>${escapeHtml(project.stage)}</td>
    <td>${escapeHtml(project.manager)}</td>
    <td>${progressCell(project.progress)}</td>
    <td>${progressCell(project.cost, true)}</td>
    <td>${milestoneLabel}</td>
    <td class="weekly-cell">${amount}</td>
  </tr>`;
}

function currentProjects() {
  const query = filters.query.trim().toLocaleLowerCase('zh-CN');
  const matches = projects.filter((project) =>
    (!filters.health || project.health === filters.health) &&
    (!filters.stage || project.stage === filters.stage) &&
    (!query || [project.name, project.customer, project.manager].some((part) => part.toLocaleLowerCase('zh-CN').includes(query))));
  if (!filters.sortKey) return matches;
  const valueOf = (project) => filters.sortKey === 'milestone' ? nearestMilestone(project)?.end : project[filters.sortKey];
  const direction = filters.sortDirection === 'ascending' ? 1 : -1;
  return matches.sort((a, b) => {
    const left = valueOf(a);
    const right = valueOf(b);
    if (left == null) return right == null ? 0 : 1;
    if (right == null) return -1;
    const diff = typeof left === 'number' ? left - right : zhCollator.compare(left, right);
    return diff * direction;
  });
}

function updateList() {
  const matches = currentProjects();
  document.querySelector('#project-rows').innerHTML = matches.length ? matches.map(projectRow).join('') :
    '<tr class="empty-row"><td colspan="9"><strong>没有符合条件的项目</strong>可调整搜索关键词或筛选条件。</td></tr>';
  document.querySelector('#project-count').textContent = matches.length === projects.length
    ? `共 ${projects.length} 个项目`
    : `显示 ${matches.length} / ${projects.length} 个项目`;
  document.querySelector('#reset-filters').disabled = !filters.query && !filters.health && !filters.stage && !filters.sortKey;
  projectView.querySelectorAll('[data-filter-health]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.filterHealth === filters.health));
  });
  projectView.querySelectorAll('[data-filter-stage]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.filterStage === filters.stage));
  });
  projectView.querySelectorAll('[data-column]').forEach((heading) => {
    const icon = heading.querySelector('.sort-icon');
    if (heading.dataset.column === filters.sortKey) {
      heading.setAttribute('aria-sort', filters.sortDirection);
      icon.textContent = filters.sortDirection === 'ascending' ? '↑' : '↓';
    } else {
      heading.removeAttribute('aria-sort');
      icon.textContent = '↕';
    }
  });
}

function syncControls() {
  document.querySelector('#project-search').value = filters.query;
  document.querySelector('#health-filter').value = filters.health;
  document.querySelector('#stage-filter').value = filters.stage;
}

function bindHome() {
  syncControls();
  updateList();
  document.querySelector('#project-search').addEventListener('input', (event) => {
    filters.query = event.target.value;
    updateList();
  });
  document.querySelector('#health-filter').addEventListener('change', (event) => {
    filters.health = event.target.value;
    updateList();
  });
  document.querySelector('#stage-filter').addEventListener('change', (event) => {
    filters.stage = event.target.value;
    updateList();
  });
  document.querySelector('#reset-filters').addEventListener('click', () => {
    Object.assign(filters, { query: '', health: '', stage: '', sortKey: '', sortDirection: '' });
    syncControls();
    document.querySelector('#project-search').focus({ preventScroll: true });
    updateList();
  });
  projectView.querySelectorAll('[data-filter-health], [data-filter-stage]').forEach((button) => {
    button.addEventListener('click', () => {
      const key = button.hasAttribute('data-filter-health') ? 'health' : 'stage';
      const selected = key === 'health' ? button.dataset.filterHealth : button.dataset.filterStage;
      filters[key] = filters[key] === selected ? '' : selected;
      syncControls();
      updateList();
    });
  });
  projectView.querySelectorAll('[data-sort]').forEach((button) => {
    button.addEventListener('click', () => {
      const key = button.dataset.sort;
      if (filters.sortKey === key) {
        filters.sortDirection = filters.sortDirection === 'ascending' ? 'descending' : 'ascending';
      } else {
        filters.sortKey = key;
        filters.sortDirection = ['name', 'milestone'].includes(key) ? 'ascending' : 'descending';
      }
      updateList();
    });
  });
  document.querySelector('#project-rows').addEventListener('click', (event) => {
    const row = event.target.closest('[data-project-row]');
    if (!row || event.button !== 0 || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    event.preventDefault();
    if (window.getSelection()?.toString()) return;
    lastListLocation = { projectId: row.dataset.projectRow, scrollY: window.scrollY, scrollX: document.querySelector('.project-grid').scrollLeft };
    history.pushState({ dashboardDetail: true }, '', '#project/' + encodeURIComponent(row.dataset.projectRow));
    renderRoute();
  });
}

function renderRoute() {
  const route = window.location.hash.startsWith('#project/') ? window.location.hash : '#projects';
  if (route === lastRoute) return;
  const previousRoute = lastRoute;
  lastRoute = route;
  workspaceTab.setAttribute('aria-current', route === '#projects' ? 'page' : 'location');
  if (route === '#projects') {
    projectView.innerHTML = renderHome();
    document.title = '项目外包看板原型';
    bindHome();
    if (previousRoute && lastListLocation) {
      const previousLink = Array.from(projectView.querySelectorAll('[data-project]')).find((link) => link.dataset.project === lastListLocation.projectId);
      document.querySelector('.project-grid').scrollLeft = lastListLocation.scrollX;
      window.scrollTo(0, lastListLocation.scrollY);
      (previousLink || workspaceTab).focus({ preventScroll: true });
    } else if (previousRoute) {
      window.scrollTo(0, 0);
      workspaceTab.focus({ preventScroll: true });
    }
    return;
  }
  let projectId = '';
  try { projectId = decodeURIComponent(route.slice('#project/'.length)); } catch { /* Show the missing project state. */ }
  const project = projects.find((item) => item.id === projectId);
  const name = project?.name || '项目详情';
  document.title = name + ' · 项目外包看板原型';
  if (project) {
    projectView.innerHTML = renderDetail(project);
    bindDetail(projectView, project);
  } else {
    projectView.innerHTML = '<section class="panel unknown-project"><h1>没有找到这个项目</h1><a href="#projects" data-return>返回项目清单</a></section>';
  }
  window.scrollTo(0, 0);
  if (previousRoute) {
    const heading = projectView.querySelector('h1');
    if (heading) {
      heading.tabIndex = -1;
      heading.focus({ preventScroll: true });
    }
  }
}

function setNavigationOpen(open, restoreFocus = false) {
  document.body.classList.toggle('mobile-nav-open', open);
  menuToggle.setAttribute('aria-expanded', String(open));
  menuToggle.setAttribute('aria-label', open ? '关闭导航' : '展开导航');
  navScrim.hidden = !open;
  if (open) sidebar.querySelector('a').focus();
  if (restoreFocus) menuToggle.focus();
}

menuToggle.addEventListener('click', () => setNavigationOpen(menuToggle.getAttribute('aria-expanded') !== 'true'));
navScrim.addEventListener('click', () => setNavigationOpen(false, true));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
    event.preventDefault();
    setNavigationOpen(false, true);
  }
});
isNarrowLayout.addEventListener('change', () => setNavigationOpen(false));

document.addEventListener('click', (event) => {
  const back = event.target.closest('a[data-return]');
  if (!back || event.button !== 0 || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
  if (menuToggle.getAttribute('aria-expanded') === 'true') {
    setNavigationOpen(false);
    workspaceTab.focus({ preventScroll: true });
  }
  if (lastRoute === '#projects') {
    event.preventDefault();
    window.scrollTo(0, 0);
  } else if (history.state?.dashboardDetail) {
    event.preventDefault();
    history.back();
  }
});
const snapshotTime = document.querySelector('#snapshot-time');
snapshotTime.dateTime = todayISO;
snapshotTime.textContent = todayISO;
document.querySelector('.skip-link').addEventListener('click', (event) => {
  event.preventDefault();
  document.querySelector('#main-content').focus();
});
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.addEventListener('popstate', renderRoute);
window.addEventListener('hashchange', renderRoute);
renderRoute();

  </script>
